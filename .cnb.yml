# 由 .github/workflows/auto-run-py.yml 迁移至 Cloud Native Build（CNB）
# - 定时：CNB 定时任务时区为 Asia/Shanghai（见官方文档），表达式为每半小时一次（:00 与 :30）
# - 手动：对应原 workflow_dispatch，使用 Web 端「手动触发 / web_trigger」
.auto_run_python: &auto_run_python
  name: 定时更新
  runner:
    tags: cnb:arch:amd64
    cpus: 2
  docker:
    image: python:3.10-bookworm
  stages:
    - name: 安装依赖
      script: |
        set -eux
        apt-get update -qq
        # FFDec（魂印/道具 SWF 导出）依赖 java 命令
        apt-get install -y -qq git openjdk-17-jre-headless
        java -version
        python -m pip install --upgrade pip
        echo "PWD:"
        pwd
        echo "Root files:"
        ls -la
        echo "Update dir files (if exists):"
        ls -la update || true
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        elif [ -f update/requirements.txt ]; then
          pip install -r update/requirements.txt
        else
          echo "ERROR: requirements.txt not found in repo root or update/ subdir"
          exit 1
        fi

    - name: 运行 Python 脚本
      script: python main.py

    - name: 收集生成的 db 文件
      script: |
        set -eux
        mkdir -p ./generated_files/db
        find ./generated_files -type f -name "*.db" -exec cp -f {} ./generated_files/db/ \;
        echo "Collected DB files:"
        ls -la ./generated_files/db || true

    - name: 清理过期的 version1 / version2 产物
      script: |
        set -eux
        python << 'PY'
        from pathlib import Path


        def resolve_version(data_dir: Path, prefix: str) -> str | None:
            """读取 prefix_<版本>.txt 中修改时间最新的一份内容。"""
            if not data_dir.is_dir():
                return None
            candidates = []
            for p in data_dir.glob(f"{prefix}_*.txt"):
                try:
                    candidates.append((p.stat().st_mtime, p.read_text(encoding="utf-8").strip()))
                except OSError:
                    continue
            if not candidates:
                return None
            return max(candidates, key=lambda x: x[0])[1]


        data_dir = Path("generated_files/plugins/新数据")
        v1 = resolve_version(data_dir, "version1")
        v2 = resolve_version(data_dir, "version2")
        if not v1 or not v2:
            print("Cannot resolve version1 and/or version2 from version1_*.txt / version2_*.txt:", v1, v2)
            print("Skip prune")
            raise SystemExit(0)

        keep_versions = {v1, v2}
        root = Path("generated_files")
        removed = []

        # 保留 main.py 写入的 version1.txt / version2.txt（无下划线），不删除遗留同名文件

        for p in root.rglob("*.db"):
            stem = p.stem
            if "_" not in stem:
                continue
            suf = stem.rsplit("_", 1)[-1]
            if suf in keep_versions:
                continue
            if not suf.isdigit():
                continue
            if len(suf) == len(v1) or len(suf) == len(v2):
                p.unlink(missing_ok=True)
                removed.append(str(p))

        for prefix, v in (("version1", v1), ("version2", v2)):
            keep_name = f"{prefix}_{v}.txt"
            if data_dir.is_dir():
                for p in data_dir.glob(f"{prefix}_*.txt"):
                    if p.name != keep_name:
                        p.unlink(missing_ok=True)
                        removed.append(str(p))

        for line in removed:
            print("Pruned:", line)
        print("Pruned", len(removed), "path(s); version1:", v1, "version2:", v2)
        PY

    - name: 提交并推送 generated_files
      script: |
        set -eux
        export GIT_TERMINAL_PROMPT=0
        REPO_HOST="${CNB_REPO_URL_HTTPS#https://}"
        PUSH_URL="https://${CNB_TOKEN_USER_NAME}:${CNB_TOKEN}@${REPO_HOST}"
        git add -A ./generated_files/
        if git diff --cached --quiet; then
          echo "No files changed, skip commit"
        else
          MSG="Auto update: Generate files at $(date +'%Y-%m-%d %H:%M:%S')"
          git -c user.name="Yogurt114514" -c user.email="1157733847@qq.com" commit -m "$MSG"
          git fetch "$PUSH_URL" "${CNB_BRANCH}" || true
          if git rev-parse FETCH_HEAD >/dev/null 2>&1; then
            git merge FETCH_HEAD --no-edit -m "Merge remote ${CNB_BRANCH} before CI push"
          fi
          git push "$PUSH_URL" "HEAD:${CNB_BRANCH}"
        fi

main:
  "crontab: 0,30 * * * *":
    - *auto_run_python
  web_trigger:
    - *auto_run_python
