# GitHub schedule 为 UTC；CNB 仍为每半小时（Asia/Shanghai），二者独立配置
name: 定时更新

on:
  schedule:
    # 每 15 分钟一次，偏移至 :07/:22/:37/:52（UTC），避开 :00/:30 整点高峰
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script-and-upload:
    name: 定时更新
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          set -eux
          sudo apt-get update -qq
          # FFDec（魂印/道具 SWF 导出）依赖 java 命令
          sudo apt-get install -y -qq git openjdk-17-jre-headless
          java -version
          python -m pip install --upgrade pip
          echo "PWD:"
          pwd
          echo "Root files:"
          ls -la
          echo "Update dir files (if exists):"
          ls -la update || true
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f update/requirements.txt ]; then
            pip install -r update/requirements.txt
          else
            echo "ERROR: requirements.txt not found in repo root or update/ subdir"
            exit 1
          fi

      - name: 运行 Python 脚本
        run: python main.py

      - name: 收集生成的 db 文件
        run: |
          set -eux
          mkdir -p ./generated_files/db
          find ./generated_files -type f -name "*.db" -exec cp -f {} ./generated_files/db/ \;
          echo "Collected DB files:"
          ls -la ./generated_files/db || true

      - name: 清理过期的 version1 / version2 产物
        run: |
          set -eux
          python << 'PY'
          from pathlib import Path


          def resolve_version(data_dir: Path, prefix: str) -> str | None:
              """读取 prefix_<版本>.txt 中修改时间最新的一份内容。"""
              if not data_dir.is_dir():
                  return None
              candidates = []
              for p in data_dir.glob(f"{prefix}_*.txt"):
                  try:
                      candidates.append((p.stat().st_mtime, p.read_text(encoding="utf-8").strip()))
                  except OSError:
                      continue
              if not candidates:
                  return None
              return max(candidates, key=lambda x: x[0])[1]


          data_dir = Path("generated_files/plugins/新数据")
          v1 = resolve_version(data_dir, "version1")
          v2 = resolve_version(data_dir, "version2")
          if not v1 or not v2:
              print("Cannot resolve version1 and/or version2 from version1_*.txt / version2_*.txt:", v1, v2)
              print("Skip prune")
              raise SystemExit(0)

          keep_versions = {v1, v2}
          root = Path("generated_files")
          removed = []

          # 保留 main.py 写入的 version1.txt / version2.txt（无下划线），不删除遗留同名文件

          for p in root.rglob("*.db"):
              stem = p.stem
              if "_" not in stem:
                  continue
              suf = stem.rsplit("_", 1)[-1]
              if suf in keep_versions:
                  continue
              if not suf.isdigit():
                  continue
              if len(suf) == len(v1) or len(suf) == len(v2):
                  p.unlink(missing_ok=True)
                  removed.append(str(p))

          for prefix, v in (("version1", v1), ("version2", v2)):
              keep_name = f"{prefix}_{v}.txt"
              if data_dir.is_dir():
                  for p in data_dir.glob(f"{prefix}_*.txt"):
                      if p.name != keep_name:
                          p.unlink(missing_ok=True)
                          removed.append(str(p))

          for line in removed:
              print("Pruned:", line)
          print("Pruned", len(removed), "path(s); version1:", v1, "version2:", v2)
          PY

      - name: 提交并推送 generated_files
        run: |
          set -eux
          git config --global user.name "Yogurt114514"
          git config --global user.email "1157733847@qq.com"
          git add -A ./generated_files/
          if git diff --cached --quiet; then
            echo "No files changed, skip commit"
          else
            git commit -m "Auto update: Generate files at $(date +'%Y-%m-%d %H:%M:%S')"
            git fetch origin "${{ github.ref_name }}" || true
            if git rev-parse FETCH_HEAD >/dev/null 2>&1; then
              git merge FETCH_HEAD --no-edit -m "Merge remote ${{ github.ref_name }} before CI push"
            fi
            git push
          fi
